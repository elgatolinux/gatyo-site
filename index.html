    <script>
      // applied before the first paint so a saved accent never flashes violet
      try {
        var a = localStorage.getItem('gatyo-accent')
        if (/^(violet|pink|lavender|cyan|mint|amber|coral)$/.test(a)) document.documentElement.setAttribute('data-accent', a)
      } catch (e) {}
    </script>

    <link rel="preload" as="image" type="image/webp" media="(min-width: 768px)" href="%BASE_URL%media/art/hero-w.webp" />
    <link rel="preload" as="image" type="image/webp" media="(max-width: 767px)" href="%BASE_URL%media/art/hero-p.webp" />

    <style>
      html, body { background: #0b0614; margin: 0; }
      #pre { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; pointer-events: none; }
      #pre picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.14); transition: opacity .5s; }
      #pre .w { position: absolute; top: 0; bottom: 0; width: 50.5%; background: rgba(11, 6, 20, .74); transform-origin: top; transition: transform .55s cubic-bezier(.76, 0, .24, 1); }
      #pre .l { left: 0; }
      #pre .r { right: 0; transition-delay: .07s; }
      #pre .c { position: relative; text-align: center; color: #f5ebff; font: 500 12px/1 ui-monospace, 'JetBrains Mono', monospace; letter-spacing: .28em; transition: opacity .2s; }
      #pre .c b { display: block; font: 600 28px/1 Outfit, system-ui, sans-serif; letter-spacing: 0; margin-bottom: 16px; color: rgb(var(--hi-rgb, 201 155 255)); }
      #pre .c i { display: block; width: 132px; height: 1px; margin: 14px auto 0; background: rgb(var(--line-rgb, 88 45 150)); overflow: hidden; }
      #pre .c u { display: block; height: 100%; background: rgb(var(--pink-rgb, 249 168 212)); transform: scaleX(0); transform-origin: left; }
      #pre.out .w { transform: scaleY(0); }
      #pre.out picture img { opacity: 0; }
      #pre.out .c { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #pre { display: none; } }
    </style>
  </head>
  <body>
    <div id="pre" aria-hidden="true">
      <picture>
        <source media="(min-width: 768px)" srcset="%BASE_URL%media/art/hero-w.webp" />
        <img src="%BASE_URL%media/art/hero-p.webp" alt="" fetchpriority="high" />
      </picture>
      <div class="w l"></div>
      <div class="w r"></div>
      <div class="c"><b>gatyo</b><span id="pre-n">000</span><i><u id="pre-b"></u></i></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('pre')
        var num = document.getElementById('pre-n')
        var bar = document.getElementById('pre-b')
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches
        var DUR = still ? 0 : 700
        var t0 = performance.now()
        var ready = false
        var done = false
        function out() {
          if (done) return
          done = true
          root.classList.add('out')
          document.documentElement.classList.add('is-in')
          window.dispatchEvent(new Event('gatyo:in'))
          setTimeout(function () { root.remove() }, still ? 0 : 750)
        }
        window.__gatyoReady = function () { ready = true }
        function tick(now) {
          if (done) return
          var k = Math.min(1, (now - t0) / (DUR || 1))
          var v = Math.floor(k * (ready ? 100 : 99))
          num.textContent = ('00' + v).slice(-3)
          bar.style.transform = 'scaleX(' + v / 100 + ')'
          if (k >= 1 && ready) out()
          else requestAnimationFrame(tick)
        }
        requestAnimationFrame(tick)
        setTimeout(out, 3200) // failsafe: never hold the page, even if the app fails
      })()
    </script>
    <noscript>
      <style>#pre { display: none; } .hero-ch, .hero-fade { opacity: 1 !important; }</style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
